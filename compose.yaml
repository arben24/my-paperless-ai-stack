services:
  # paperless-ngx main service
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless-ngx
    restart: unless-stopped
    env_file: 
      - ./paperless/.env
    depends_on:
      - postgres
      - redis
      - gotenberg
      - tika
    ports:
      - "8000:8000"
    volumes:
      - ./paperless/data:/usr/src/paperless/data
      - ./paperless/media:/usr/src/paperless/media
      - ./paperless/export:/usr/src/paperless/export
      - ./paperless/consume:/usr/src/paperless/consume
  
  # postgres database for paperless-ngx
  postgres:
    image: postgres:18
    restart: unless-stopped
    container_name: postgres
    env_file: 
      - ./postgres/.env
    volumes:
      - ./postgres/data:/var/lib/postgresql
  
  # redis database for paperless-ngx
  redis:
    image: docker.io/library/redis:8
    container_name: redis
    restart: unless-stopped
    env_file: 
      - ./redis/.env
    volumes:
      - ./redis/data:/data
  
  # gotenberg service that paperless uses for document conversion
  gotenberg:
    image: docker.io/gotenberg/gotenberg:8.25
    container_name: gotenberg
    env_file: 
      - ./gotenberg/.env
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
  
  # tika service that paperless uses for document text extraction
  tika:
    image: docker.io/apache/tika:latest
    container_name: tika
    restart: unless-stopped
    env_file: ./tika/.env
  

    # open-webui service for LLM interaction
  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    restart: unless-stopped
    env_file:
      - ./open-webui/.env
    ports:
      - "3001:8080"
    volumes:
      - ./open-webui/data:/app/backend/data

  # ollama service — DEAKTIVIERT.
  # Der Stack nutzt die native Windows-Ollama-Installation ueber
  # http://host.docker.internal:11434. Zwei Ollama-Instanzen haben sich
  # die 12 GB VRAM der RTX 4070 gegenseitig weggenommen.
  # Zum Reaktivieren: Block einkommentieren und die Endpunkte in
  # open-webui/.env, paperless-gpt/.env und den Paperless-KI-Einstellungen
  # zurueck auf http://ollama:11434 setzen.
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   env_file:
  #     - ./ollama/.env
  #   volumes:
  #     - ./ollama/data/:/root/.ollama
  #     - ./ollama/models:/ollama-models
  #   restart: unless-stopped
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]

  # docling-serve — hOCR-faehiger OCR-Provider.
  # Ollama-Modelle liefern nur reinen Text ohne Positionsangaben; fuer ein
  # durchsuchbares PDF (und damit den Rueckweg des OCR-Texts nach Paperless)
  # braucht paperless-gpt hOCR. Docling liefert das.
  # GPU-Variante: nutzt die RTX 4070 mit. Fuer die CPU-Variante das Image auf
  # ghcr.io/docling-project/docling-serve-cpu:latest aendern und den
  # deploy-Block entfernen.
  docling:
    image: ghcr.io/docling-project/docling-serve:latest
    container_name: docling
    restart: unless-stopped
    env_file:
      - ./docling/.env
    ports:
      - "5001:5001"
    volumes:
      - ./docling/data:/opt/app-root/src/.cache/docling/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # paperless-gpt service
  paperless-gpt:
    image: icereed/paperless-gpt:latest
    container_name: paperless-gpt
    restart: unless-stopped
    depends_on:
      - paperless
      - docling
    ports:
      - "3002:8080"
    env_file:
      - ./paperless-gpt/.env
    volumes:
      - ./paperless-gpt/prompts:/app/prompts # Mount the prompts directory


  # optional but helpful log viewer
  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    container_name: dozzle
    env_file: 
      - ./dozzle/.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dozzle/data:/data
    ports:
      - "8080:8080"
